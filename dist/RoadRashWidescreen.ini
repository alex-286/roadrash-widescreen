; Road Rash Widescreen Patch - settings
;
; This file is optional. Keep it next to ROADRASH.EXE and ddraw.dll.
; Every value below is the default; delete a line to use the default.
; Changes take effect the next time the game starts.

[Display]

; Screen resolution used during races. 0 = your desktop resolution.
; If the resolution is not available, 1920x1080 is tried, then 720x480,
; then the game's original 640x480.
DisplayWidth=0
DisplayHeight=0

; Width the game renders at, as a multiple of 8 from 640 to 1280.
; 0 = match the aspect ratio of the screen (856 for 16:9, 1120 for 21:9).
; Other values change the aspect ratio of the picture.
VirtualWidth=0

; 1 = wait for the vertical blank before each frame. Prevents tearing, but
;     limits the frame rate to the refresh rate of the monitor.
; 0 = do not wait.
WaitForVBlank=1

; Display filter used to enlarge the picture:
;   none            original look in the game's 8-bit display mode
;                   (most compatible, recommended for slow PCs)
;   nearest         sharp, blocky pixels
;   sharp-bilinear  crisp pixels of even size at any resolution
;   bicubic         smooth, photo-like enlargement
; With any filter except none, F11 cycles through the filters in a race.
Filter=none

; How many road segments ahead the game draws: 33 to 48, or 32 for the
; original game.
; More segments show the road further into the distance, at some cost in
; speed. The scenery beside the road appears once its pictures are loaded;
; riders, cars and pedestrians appear at the original distance.
DrawDistance=48

; How many of the farthest road segments fade into a haze, so the road
; does not pop in at the far end: 1-16, or 0 = off.
DistanceFade=16

; Only for the filters other than none:
; 1 = the filters write straight into the screen instead of copying each
;     frame to it, which saves several milliseconds per frame on older PCs.
;     Not used while Scanlines are on (except with nearest).
; 0 = copy each frame. Try it if a filter shows tearing or flickering.
DirectPresent=1

; CRT-style scanlines on top of the filter, in percent: 0 = off, 1-100.
; 30 to 50 is a good start. Not shown with the none and nearest filters.
Scanlines=0

; On-screen display in the top-left corner during races.
; ShowFps: 1 = show the frame rate.  ShowFilter: 1 = show the filter name.
ShowFps=0
ShowFilter=0

; 2 = draw the race at twice the resolution (960 lines, for example
;     1712x960 at 16:9) for sharper roads, scenery and riders. The sky and
;     the cockpit are enlarged from their original art.
; 1 = the original 480 lines, for very slow PCs.
; On Windows 98 PCs, Filter=none runs at about 60 fps at 1920x1080 with
; RenderScale=2 (Pentium Dual-Core); with nearest and sharp-bilinear,
; use WaitForVBlank=0 for more than 30 fps.
RenderScale=2

; 1 = the menus keep the screen resolution of the races: the 640x480 menu
;     fills the screen height in the middle of the screen (2.25x at
;     1920x1080, 3x at 2560x1440), and the videos are enlarged by the
;     largest whole factor that fits, on black, instead of switching the
;     screen to 640x480 for every menu.
; 0 = switch to 640x480 for the menus, as the original game does.
NativeMenus=1

; Only with NativeMenus=1: the area around the menu.
; 1 = the menu picture, enlarged to the whole screen, blurred and darkened.
; 0 = black.
MenuBackground=1

; Another DirectDraw library that the patch passes the game's DirectDraw
; calls on to, instead of the one of Windows. For a DirectDraw wrapper that
; would also need the name ddraw.dll: rename the wrapper (for example to
; dd2d9.dll), keep it next to ROADRASH.EXE and enter its name here. Empty =
; the DirectDraw library of Windows.
ChainDll=

[Fixes]

; Fixes for faults in the original game. 1 = on, 0 = the original behavior.

; The Rat and Super bikes race in each other's colors in the original game
; (the shop shows them correctly). 1 = give them their own colors.
FixBikeColors=1

; In High Resolution mode the game moves buildings, riders and cars in
; steps of 2 pixels. 1 = move them in 1-pixel steps, so they glide smoothly.
SmoothSprites=1

; On Windows Vista and newer, a music volume of 0 in the Sound Mix screen
; also mutes all other sound of the game in the Windows volume mixer, even
; after a restart. 1 = leave the music off instead, so the other sounds
; stay audible. Has no audible effect on Windows 95/98/ME.
MidiVolumeGuard=1

; The MIDI output for the music during races (the menus play their music
; from the video files). -1 = the MIDI mapper, as the original game does:
; it plays on the output chosen in the Windows Control Panel (Multimedia,
; MIDI). If the races stay silent while the menus have music, the mapper
; may lead to an external MIDI port: the log then lists every MIDI output
; with its number (lines "MIDI output ..."); enter the number of a
; synthesizer here, for example the SoundFont synthesizer of a Sound
; Blaster Live or Audigy.
MusicDevice=-1

; The game updates riders and cars further ahead less often (up to every
; 8th game tick), so they move in jumps in the distance. 1 = update every
; rider and car in view on every tick, so they move smoothly.
FullRateObjects=1

; In the first frame of a punch, the rider's shadow jumps far away from the
; bike. 1 = keep it under the bike.
FixPunchShadow=1

; The red barn, the brown shop with the sign and the white house hover
; above the ground. 1 = draw them standing on the ground.
GroundBuildings=1

; The distance in the cockpit wraps to 0 after 25.5 (most courses in
; kilometers are longer) and shows 25.x before the start line. 1 = show
; the whole distance.
FixOdometer=1

; The road and its edges jump by a few pixels while riding, because the
; game drops parts of a unit when it projects the road. 1 = keep them, so
; the road moves smoothly.
SmoothRoad=1
