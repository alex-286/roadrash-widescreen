; Road Rash Widescreen Patch - settings
;
; This file is optional. Keep it next to ROADRASH.EXE and ddraw.dll.
; Every value below is the default; delete a line to use the default.
; Changes take effect the next time the game starts.

[Display]

; Screen resolution used during races. 0 = your desktop resolution.
; If the resolution is not available, 1920x1080 is tried, then 720x480,
; then the game's original 640x480.
DisplayWidth=0
DisplayHeight=0

; Width the game renders at, as a multiple of 8 from 640 to 1280.
; 0 = match the aspect ratio of the screen (856 for 16:9, 1120 for 21:9).
; Other values change the aspect ratio of the picture.
VirtualWidth=0

; 1 = wait for the vertical blank before each frame. Prevents tearing, but
;     limits the frame rate to the refresh rate of the monitor.
; 0 = do not wait.
WaitForVBlank=1

; Display filter used to enlarge the picture:
;   none            original look in the game's 8-bit display mode
;                   (most compatible, recommended for slow PCs)
;   nearest         sharp, blocky pixels
;   hqx             smooths edges between flat colors
;   xbr             like hqx, with rounder outlines and cleaner diagonals
;   sharp-bilinear  crisp pixels of even size at any resolution
;   bicubic         smooth, photo-like enlargement
; With any filter except none, F11 cycles through the filters in a race.
Filter=none

; Scale factor of the hqx and xbr filters: 2 or 3. Their result is then
; scaled smoothly to the screen size.
; 0 = automatic: the smallest factor that reaches the screen height
;     (2 up to 960 screen lines, 3 above). A lower factor is faster.
HqxScale=0

; CRT-style scanlines on top of the filter, in percent: 0 = off, 1-100.
; 30 to 50 is a good start. Not shown with the none and nearest filters.
Scanlines=0

; On-screen display in the top-left corner during races.
; ShowFps: 1 = show the frame rate.  ShowFilter: 1 = show the filter name.
ShowFps=0
ShowFilter=0
